<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Билеты и жильё — дашборд</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
       background: #0f1216; color: #e8eaed; }
header { padding: 28px 24px 14px; max-width: 1100px; margin: 0 auto; }
h1 { font-size: 24px; margin: 0 0 6px; }
.sub { color: #8b98a8; font-size: 14px; }
main { max-width: 1100px; margin: 0 auto; padding: 10px 24px 70px; }
h2 { font-size: 17px; color: #a9b6c5; margin: 28px 0 10px; }
.card { background: #171c22; border: 1px solid #232a33; border-radius: 12px;
        padding: 14px 16px; margin-bottom: 10px; display: flex; gap: 18px;
        justify-content: space-between; flex-wrap: wrap; }
.city { font-weight: 600; font-size: 15px; }
.meta { color: #8b98a8; font-size: 13px; margin-top: 4px; line-height: 1.5; }
.price { color: #6ee7a8; font-weight: 700; font-size: 16px; white-space: nowrap; }
.links { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.links a { background: #1d2733; border: 1px solid #2a3a4d; border-radius: 8px;
           padding: 7px 11px; font-size: 13px; color: #7cc4ff; text-decoration: none; }
.links a:hover { background: #243447; }
.empty { color: #8b98a8; padding: 30px 0; }
.note { color: #6e7b8a; font-size: 12px; margin-top: 26px; }
</style>
</head>
<body>
<header>
  <h1>Билеты и жильё</h1>
  <div class="sub" id="updated">Загружаю…</div>
</header>
<main id="content"></main>
<script>
const money = new Intl.NumberFormat('ru-RU');
const fmtMoney = n => money.format(n) + ' ₽';
const fmtNights = n => n + ' ' + (n === 1 ? 'ночь' : n < 5 ? 'ночи' : 'ночей');
const fmtStops = n => n === 0 ? 'без пересадок' : n + ' пересадк' + (n === 1 ? 'а' : 'и');
const esc = s => String(s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function card(o) {
  const route = `${o.origin_name || o.origin} → ${o.city}`;
  return `<div class="card">
    <div>
      <div class="city">${esc(route)}</div>
      <div class="meta">${esc(o.checkin)} — ${esc(o.checkout)} · ${fmtNights(o.nights)} ·
        ${o.stops === null ? 'пересадки: ?' : fmtStops(o.stops)}
        ${o.duration_hours ? ' · ≈' + Math.round(o.duration_hours) + ' ч' : ''}</div>
      <div class="links">${o.links.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name)}</a>`).join('')}</div>
    </div>
    <div class="price">${fmtMoney(o.price)}</div>
  </div>`;
}

function render(data) {
  document.getElementById('updated').textContent = data.updated_at
    ? 'обновлено ' + data.updated_at + ' · направлений: ' + data.offers.length
    : 'данных пока нет';
  const groups = {};
  (data.offers || []).forEach(o => (groups[o.country || 'Другое'] = groups[o.country || 'Другое'] || []).push(o));
  const countries = Object.keys(groups).sort((a, b) => a.localeCompare(b, 'ru'));
  const content = document.getElementById('content');
  if (!countries.length) { content.innerHTML = '<div class="empty">Данных пока нет.</div>'; return; }
  content.innerHTML = countries.map(country => `
    <h2>${esc(country)}</h2>
    ${groups[country].sort((a, b) => a.price - b.price).map(card).join('')}
  `).join('') + `<div class="note">Цены из кэша Aviasales. Ссылки ведут на поиск билетов и жилья.</div>`;
}

fetch('data.json?ts=' + Date.now())
  .then(r => r.json())
  .then(render)
  .catch(err => {
    document.getElementById('updated').textContent = 'Не удалось загрузить данные';
    document.getElementById('content').innerHTML = '<div class="empty">' + esc(String(err)) + '</div>';
  });
</script>
</body>
</html>
